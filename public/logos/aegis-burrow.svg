<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Aegis × Burrow">
  <defs>
    <linearGradient id="ab-tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1b1f"/><stop offset="1" stop-color="#060607"/></linearGradient>
    <linearGradient id="ab-ink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#bfc3c9"/></linearGradient>
    <radialGradient id="ab-glow" cx=".5" cy="0" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="ab-light" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <clipPath id="ab-in"><path d="M64 26.5 38 35.5v21.5c0 19.6 11.2 35.4 26 42.6 14.8-7.2 26-23 26-42.6V35.5z"/></clipPath>
  </defs>
  <rect x="3" y="3" width="122" height="122" rx="30" fill="url(#ab-tile)"/>
  <rect x="3" y="3" width="122" height="122" rx="30" fill="url(#ab-glow)"/>
  <rect x="3.5" y="3.5" width="121" height="121" rx="29.5" fill="none" stroke="#fff" stroke-opacity=".14"/>
  <path d="M38 6.5h52" stroke="#fff" stroke-opacity=".5" stroke-linecap="round"/>
  <!-- Aegis: the shield -->
  <path d="M64 18 30 29.5v27.5c0 24.4 14.4 44 34 53 19.6-9 34-28.6 34-53V29.5z" fill="none" stroke="url(#ab-ink)" stroke-width="8" stroke-linejoin="round"/>
  <!-- Burrow: the tunnel going in, inside the shield, and the light at its end -->
  <g clip-path="url(#ab-in)">
    <rect x="30" y="20" width="68" height="90" fill="#fff" fill-opacity=".05"/>
    <path d="M43 104V64a21 21 0 0 1 42 0v40" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <path d="M54 104V66a10 10 0 0 1 20 0v38" fill="none" stroke="#fff" stroke-opacity=".42" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="64" cy="78" r="12" fill="url(#ab-light)"/>
    <circle cx="64" cy="78" r="5" fill="#fff"/>
  </g>
</svg>
