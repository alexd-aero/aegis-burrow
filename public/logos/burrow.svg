      <stop offset="0" stop-color="#1a1b1f"/>
      <stop offset="1" stop-color="#060607"/>
    </linearGradient>
    <linearGradient id="bw-ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4c7cc"/>
