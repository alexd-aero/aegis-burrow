<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Aegis × Burrow: a post-quantum gate on a tunnel engine">
  <title>Aegis × Burrow</title>
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <radialGradient id="fade" cx=".5" cy="0" r=".9">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".75" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="m"><rect width="1200" height="330" fill="url(#fade)"/></mask>
    <radialGradient id="glow" cx=".5" cy="0" r=".6">
      <stop offset="0" stop-color="#fff" stop-opacity=".09"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1b1f"/><stop offset="1" stop-color="#060607"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#bfc3c9"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="layer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity=".015"/>
    </linearGradient>
    <radialGradient id="light" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="inside"><path d="M64 26.5 38 35.5v21.5c0 19.6 11.2 35.4 26 42.6 14.8-7.2 26-23 26-42.6V35.5z"/></clipPath>
  </defs>
  <rect width="1200" height="330" rx="22" fill="#030304"/>
  <rect width="1200" height="330" rx="22" fill="url(#grid)" mask="url(#m)"/>
  <rect width="1200" height="330" rx="22" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1199" height="329" rx="21.5" fill="none" stroke="#fff" stroke-opacity=".1"/>
  <path d="M300 .5h600" stroke="url(#edge)"/>

  <!-- the unified logo, large -->
  <circle cx="158" cy="160" r="150" fill="url(#halo)"/>
  <g transform="translate(66 68)">
    <rect width="184" height="184" rx="44" fill="url(#tile)"/>
    <rect x=".5" y=".5" width="183" height="183" rx="43.5" fill="none" stroke="#fff" stroke-opacity=".14"/>
    <path d="M50 1h84" stroke="#fff" stroke-opacity=".5"/>
    <g transform="translate(-0.5 -2) scale(1.445)">
      <path d="M64 18 30 29.5v27.5c0 24.4 14.4 44 34 53 19.6-9 34-28.6 34-53V29.5z" fill="none" stroke="url(#ink)" stroke-width="8" stroke-linejoin="round"/>
      <g clip-path="url(#inside)">
        <rect x="30" y="20" width="68" height="90" fill="#fff" fill-opacity=".05"/>
        <path d="M43 104V64a21 21 0 0 1 42 0v40" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
        <path d="M54 104V66a10 10 0 0 1 20 0v38" fill="none" stroke="#fff" stroke-opacity=".42" stroke-width="5.5" stroke-linecap="round"/>
        <circle cx="64" cy="78" r="12" fill="url(#light)"/>
        <circle cx="64" cy="78" r="5" fill="#fff"/>
      </g>
    </g>
  </g>

  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" fill="#eceef0">
    <text x="300" y="124" font-size="70" font-weight="700" letter-spacing="-2.4">Aegis <tspan fill="#5d6168" font-weight="300" letter-spacing="0">×</tspan> Burrow</text>
    <text x="303" y="162" font-size="21" fill="#8a8f97">A post-quantum gate, on a tunnel engine. Self-hosted, one login for everything.</text>
  </g>

  <!-- the two halves, stacked: Aegis on top, Burrow underneath -->
  <path d="M318 214v34" stroke="#fff" stroke-opacity=".22" stroke-width="1.5" stroke-dasharray="3 4"/>
  <g font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="13.5">
    <g transform="translate(300 186)">
      <rect width="836" height="40" rx="12" fill="url(#layer)" stroke="#fff" stroke-opacity=".14"/>
      <g transform="translate(9 7) scale(.205)">
        <path d="M64 18 30 29.5v27.5c0 24.4 14.4 44 34 53 19.6-9 34-28.6 34-53V29.5z" fill="none" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
      </g>
      <text x="44" y="25" fill="#eceef0" font-weight="700" letter-spacing="1.5">AEGIS</text>
      <text x="106" y="25" fill="#5d6168">the gate + UI</text>
      <text x="240" y="25" fill="#a9adb4">ML-KEM-768 + X25519 login · dashboard · Termix · Selkies Forge</text>
    </g>
    <g transform="translate(300 236)">
      <rect width="836" height="40" rx="12" fill="url(#layer)" stroke="#fff" stroke-opacity=".14"/>
      <g transform="translate(9 6) scale(.22)">
        <path d="M28 96V66a36 36 0 0 1 72 0v30" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/>
        <circle cx="64" cy="82" r="9" fill="#fff"/>
      </g>
      <text x="44" y="25" fill="#eceef0" font-weight="700" letter-spacing="1.5">BURROW</text>
      <text x="114" y="25" fill="#5d6168">the engine</text>
      <circle cx="248" cy="20" r="4" fill="#3ddc97"/>
      <text x="260" y="25" fill="#a9adb4">tunnel-3000-you.dev · trycloudflare · control socket</text>
    </g>
  </g>
  <g font-family="'DejaVu Sans Mono', monospace" font-size="12.5" fill="#5d6168">
    <text x="1136" y="306" text-anchor="end">curl -fsSL …/aegis-burrow/main/install.sh | bash</text>
  </g>
</svg>
